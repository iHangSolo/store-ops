name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ========== 后端测试与构建 ==========
  backend:
    name: 后端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: server/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 运行测试
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: ./server/coverage.out
          flags: backend
          fail_ci_if_error: false

      - name: 构建
        run: go build -v -o store-ops-server ./cmd/server

  # ========== 前端检查与构建 ==========
  frontend:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  # ========== Docker 镜像构建 ==========
  docker:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: ${{ secrets.DOCKER_USERNAME || 'local' }}/store-ops-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== Windows 客户端构建（仅 tag） ==========
  client:
    name: 构建 Windows 客户端
    runs-on: windows-latest
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 安装前端依赖
        working-directory: client/frontend
        run: npm ci

      - name: 构建客户端
        working-directory: client
        run: wails build -platform windows/amd64

      - name: 上传客户端
        uses: actions/upload-artifact@v4
        with:
          name: store-ops-client-windows
          path: client/build/bin/store-ops-client.exe
          retention-days: 30

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: client/build/bin/store-ops-client.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}